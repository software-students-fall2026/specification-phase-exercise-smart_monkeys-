nctions</text><text x="174" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• Standard form: y = ax² + bx + c</text><text x="174" y="479" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• The graph of a quadratic is a parabola.</text><text x="174" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• A constant shifts the graph up or down.</text><text x="174" y="770" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555">Slide 2 of 3</text><rect x="148" y="824" width="900" height="27" rx="0" fill="#fafafa" stroke="#aaa" stroke-width="1.5"/><text x="160" y="843" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222">Live transcription: “Plot y equals x squared.”</text><text x="148" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">&lt; Previous slide</text><text x="914" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Next slide &gt;</text><rect x="88" y="363" width="40" height="166" rx="3" fill="#fafafa" stroke="#aaa" stroke-width="1.5"/><text x="101" y="394" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">↖</text><text x="101" y="432" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">+</text><text x="101" y="470" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">✎</text><text x="101" y="508" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">⋮</text><text x="683" y="443" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">y = x²</text><path d="M 652.0 459 V 684" stroke="#ddd" fill="none"/><text x="646.0" y="704" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222">-5</text><path d="M 819.5 459 V 684" stroke="#ddd" fill="none"/><text x="813.5" y="704" font-family="Arial, sans-serif" font-size="12" fon