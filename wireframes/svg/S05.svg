<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="36" y="39" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">S05  /  Continue reviewing without graph</text><text x="36" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555">Student stories 8, 9  ·  Low-fidelity wireframe</text><rect x="28" y="94" width="1384" height="796" rx="4" fill="white" stroke="#333" stroke-width="1.5"/><rect x="28" y="94" width="1384" height="60" rx="0" fill="#fafafa" stroke="#777" stroke-width="1.5"/><text x="52" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222">☰  The Slide Machine</text><text x="305" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">Shared lecture</text><text x="1240" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Student view</text><text x="148" y="194" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Introduction to Quadratic Functions</text><text x="148" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555">Shared lecture materials · Read only</text><rect x="148" y="246" width="900" height="95" rx="0" fill="white" stroke="#aaa" stroke-width="1.5"/><text x="173" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">What is a quadratic function?</text><text x="173" y="307" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">A second-degree relationship. Its graph is a parabola.</text><rect x="148" y="363" width="900" height="450" rx="0" fill="white" stroke="#555" stroke-width="1.5"/><text x="174" y="404" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Graphing quadratic functions</text><text x="174" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• Standard form: y = ax² + bx + c</text><text x="174" y="479" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• The graph of a quadratic is a parabola.</text><text x="174" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• A constant shifts the graph up or down.</text><rect x="608" y="425" width="404" height="303" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/><text x="630" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">Graph unavailable</text><text x="630" y="534" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">Continue with the lecture text.</text><text x="630" y="561" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">Try loading the graph again later.</text><rect x="630" y="616" width="161" height="38" rx="3" fill="white" stroke="#333" stroke-width="1.5"/><text x="642" y="641" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222">Try loading again</text><text x="36" y="927" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#222">Do not replace unavailable instructional content with a plausible but unverified image.</text><text x="36" y="958" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555">Flow: Try loading again → S01 or S03; next/previous → lecture navigation</text><text x="174" y="770" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555">Slide 2 of 3</text><text x="148" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">&lt; Previous slide</text><text x="914" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Next slide &gt;</text></svg>