<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="36" y="39" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">I05  /  Edit equation and graph properties</text><text x="36" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555">Instructor story 7  ·  Low-fidelity wireframe</text><rect x="28" y="94" width="1384" height="796" rx="4" fill="white" stroke="#333" stroke-width="1.5"/><rect x="28" y="94" width="1384" height="60" rx="0" fill="#fafafa" stroke="#777" stroke-width="1.5"/><text x="52" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222">☰  The Slide Machine</text><text x="305" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">Select project  /  Introduction to Quadratic Functions</text><text x="1240" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Instructor view</text><text x="148" y="194" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222">Introduction to Quadratic Functions</text><text x="148" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555">Lecture in progress · Speech capture active</text><rect x="148" y="246" width="900" height="95" rx="0" fill="white" stroke="#aaa" stroke-width="1.5"/><text x="173" y="278" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">What is a quadratic function?</text><text x="173" y="307" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">A second-degree relationship. Its graph is a parabola.</text><rect x="148" y="363" width="900" height="450" rx="0" fill="white" stroke="#555" stroke-width="1.5"/><text x="174" y="404" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Graphing quadratic functions</text><text x="174" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• Standard form: y = ax² + bx + c</text><text x="174" y="479" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• The graph of a quadratic is a parabola.</text><text x="174" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222">• A constant shifts the graph up or down.</text><text x="174" y="770" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555">Slide 2 of 3</text><rect x="148" y="824" width="900" height="27" rx="0" fill="#fafafa" stroke="#aaa" stroke-width="1.5"/><text x="160" y="843" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222">Live transcription: “Plot y equals x squared.”</text><text x="148" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">&lt; Previous slide</text><text x="914" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Next slide &gt;</text><rect x="88" y="363" width="40" height="166" rx="3" fill="#fafafa" stroke="#aaa" stroke-width="1.5"/><text x="101" y="394" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">↖</text><text x="101" y="432" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">+</text><text x="101" y="470" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">✎</text><text x="101" y="508" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">⋮</text><text x="683" y="443" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222">y = x²</text><path d="M 652.0 459 V 684" stroke="#ddd" fill="none"/><text x="646.0" y="704" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222">-5</text><path d="M 819.5 459 V 684" stroke="#ddd" fill="none"/><text x="813.5" y="704" font-family="Arial, sans-serif" font-size="12" fo